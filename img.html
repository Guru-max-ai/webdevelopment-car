<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multiple Images</title>

    <style>
        #image-container img{
            width: 300px;
            margin: 10px 0;
        }
    </style>
</head>
<body>

    <div id="image-container">
        <img src="https://images.unsplash.com/photo-1503376780353-7e6692767b70?w=800" alt="Car">
    </div>

    <button onclick="multi()">Click Me</button>

    <script>
        function multi() {
            var newimg = document.createElement("img");
        

            newimg.src = "https://images.unsplash.com/photo-1503376780353-7e6692767b70?w=800";

            document.getElementById("image-container").append(newimg);
        }
    </script>

</body>
</html>
